databases:
  - name: buscalink-db
    databaseName: buscalink_bot_db
    user: buscalink_bot
    plan: free

services:
  - type: web
    name: buscalink-bot
    runtime: python
    region: oregon
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python bot.py"
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: buscalink-db
          property: connectionString
      - key: PIX_PROVIDER
        value: mock
      - key: PIX_AMOUNT_CENTS
        value: "500"
      - key: DB_PATH
        value: /opt/render/project/src/bot.db
      - key: MAX_DURATION_SECONDS
        value: "1200"
      - key: MAX_HEIGHT
        value: "720"
      - key: COOLDOWN_SECONDS
        value: "30"
      - key: FREE_TOKENS
        value: "1"
      - key: TOKENS_PER_PAYMENT
        value: "1"
